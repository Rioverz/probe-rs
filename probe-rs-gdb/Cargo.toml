[package]
name = "probe-rs-gdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
description = "The probe-rs GDB target description and memory map as a library. The code comes from the probe-rs GDB server with the deltas listed in EXTRACTION.md."
publish = false

[dependencies]
# The fork core crate with no probe-rs feature
# Kept as a direct path dep (not `workspace = true`): the workspace `probe-rs`
# dependency uses default features, and Cargo forbids overriding `default-features`
# on an inherited dependency, so the required `default-features = false` selection
# can only be expressed directly.
probe-rs = { path = "../probe-rs", default-features = false }

[lints]
workspace = true
