[package]
name = "probe-rs-gdb"
version = "0.32.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "OPI-GDB-LIB: the probe-rs GDB server exposed as a library that serves RSP against a worker-owned, borrowed Session. Engine files are byte-verbatim from probe-rs-tools at the pinned commit; see EXTRACTION.md."
publish = false

[dependencies]
# The fork's own patched core crate. The GDB server only borrows its Session;
# builtin-formats provides the flashing types the GDB flash-load path borrows.
probe-rs = { path = "../probe-rs", default-features = false, features = ["builtin-formats"] }

# Matched to probe-rs-tools @ 48f5e4d53c690a1d40c2454033c6f785b4f4f95c
# (the GDB stub's own dependencies).
gdbstub = "=0.7.8"
parking_lot = "0.12.2"
anyhow = "1"
itertools = "0.15"
tracing = "0.1"

[dev-dependencies]
# Borrowed-session seam proof (tests/borrowed_session_seam.rs).
probe-rs = { path = "../probe-rs", default-features = false, features = ["builtin-formats"] }
parking_lot = "0.12.2"
anyhow = "1"
